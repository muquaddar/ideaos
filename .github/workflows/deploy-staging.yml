name: Deploy Staging

# T-502: merge to main deploys to staging + runs smoke tests (NFR-003).
# Interim, no Render/Fly.io account yet: runs the built server on localhost inside the
# runner and smoke-tests against it, so the smoke-test logic is real and CI-verified now.
# Swap back to a real deploy (render.yaml -> ideaos-staging) by triggering
# RENDER_DEPLOY_HOOK_URL and smoke-testing STAGING_URL once an account exists.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Run server locally + smoke test
        run: |
          set -uo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Deploy log — $(date -u +%FT%TZ)" >> "$SUMMARY"
          echo "- mode: LOCAL (no hosting account yet — see render.yaml for the real target)" >> "$SUMMARY"

          PORT=4000 NODE_ENV=production node dist/server.js &
          SERVER_PID=$!

          ok=false
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:4000/health -o /tmp/health.json; then
              ok=true
              break
            fi
            sleep 1
          done

          kill "$SERVER_PID" 2>/dev/null || true

          if [ "$ok" = true ]; then
            echo "- smoke test PASSED: http://localhost:4000/health -> $(cat /tmp/health.json)" >> "$SUMMARY"
          else
            echo "- smoke test FAILED: server never became healthy" >> "$SUMMARY"
            exit 1
          fi
