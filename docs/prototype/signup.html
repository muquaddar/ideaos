<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdeaOS — Sign up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app app--auth" data-screen="signup">
<main class="content" style="min-height:100vh;display:grid;place-items:center;max-width:none">
  <div style="width:min(440px,92vw)">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
      <span class="logo" style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--status-incubate));display:grid;place-items:center;color:#fff;font-weight:800">◉</span>
      <div><b style="font-size:18px">IdeaOS</b><div class="dim" style="font-size:12px">A cognitive OS for builders</div></div>
      <div style="flex:1"></div>
      <button class="theme-toggle" style="width:auto" id="themeBtn" type="button"><span data-theme-label></span></button>
    </div>

    <div class="card pad-lg">
      <h1 style="margin:0 0 4px;font-size:22px;letter-spacing:-.02em">Create your private account</h1>
      <p class="muted" style="margin:0 0 18px;font-size:13.5px">Your idea graph is the most private thing you own. It is encrypted, never sold, and fully exportable.</p>

      <label class="field"><span>Email</span>
        <input class="input" type="email" id="email" placeholder="you@example.com" value="maya@builders.dev">
      </label>
      <label class="field"><span>Password</span>
        <input class="input" type="password" id="pw" placeholder="At least 12 characters" value="correct horse battery">
        <p class="hint ok" id="pwHint">Strong · not found in known breaches</p>
      </label>
      <button class="btn primary block lg" id="create">Create account</button>
      <p class="dim" style="text-align:center;font-size:12.5px;margin:16px 0 0">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
    <p class="dim" style="text-align:center;font-size:12px;margin-top:14px"><a href="index.html">← Prototype map</a></p>
  </div>
</main>
<script src="assets/graph-data.js"></script>
<script src="assets/prototype.js"></script>
<script>
  var pw = document.getElementById('pw'), hint = document.getElementById('pwHint');
  pw.addEventListener('input', function(){
    if (pw.value.length < 12){ hint.className='hint bad'; hint.textContent='Too short — use at least 12 characters'; }
    else { hint.className='hint ok'; hint.textContent='Strong · not found in known breaches'; }
  });
  document.getElementById('create').addEventListener('click', function(){
    PROTO.toast('Account created — verification email sent'); setTimeout(function(){ location.href='home.html?state=empty'; }, 700);
  });
  document.getElementById('themeBtn').addEventListener('click', function(){ var h=document.documentElement; var n=h.getAttribute('data-theme')==='dark'?'light':'dark'; h.setAttribute('data-theme',n); localStorage.setItem('ideaos-theme',n); });
</script>
</body>
</html>
